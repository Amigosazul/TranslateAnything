<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title data-i18n="app.name"></title>
    <link rel="stylesheet" href="/src/frame/frame.css" />
  </head>
  <body>
    <!-- 译文层：按原文位置覆盖 -->
    <div id="blocks"></div>
    <!-- 边框 -->
    <div id="border"></div>
    <!-- 边缘缩放热区 -->
    <div class="edge" data-dir="North"></div>
    <div class="edge" data-dir="South"></div>
    <div class="edge" data-dir="West"></div>
    <div class="edge" data-dir="East"></div>
    <div class="edge" data-dir="NorthWest"></div>
    <div class="edge" data-dir="NorthEast"></div>
    <div class="edge" data-dir="SouthWest"></div>
    <div class="edge" data-dir="SouthEast"></div>
    <!-- 工具条（右上角，鼠标进入翻译框时显示） -->
    <div id="toolbar">
      <span id="status" title=""></span>
      <button id="btn-move" data-i18n-title="frame.move">⠿</button>
      <button id="btn-original" data-i18n-title="frame.show_original" data-i18n="frame.original_label"></button>
      <button id="btn-pause" data-i18n-title="frame.pause">❚❚</button>
      <button id="btn-close" data-i18n-title="frame.close">✕</button>
    </div>
    <div id="error" hidden></div>
    <script type="module" src="/src/frame/main.ts"></script>
  </body>
</html>
